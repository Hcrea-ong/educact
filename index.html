<script>

function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function $(s){return document.querySelector(s)}

 if(!cur.cls||!C(cur.cls))cur.cls=S.classes[0]?S.classes[0].id:'';if(!can(cur.tab))cur.tab=RL[role()].t.split(' ')[0];
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===cur.tab);b.style.display=can(b.dataset.t)?'':'none'});var tg=$('.tag');if(tg)tg.textContent='L’excellence éducative au quotidien'+(role()?' · '+RL[role()].n:'');

function pasteSt(){
 var m=$('#im'),L=$('#ns').value.split(/\r?\n/),cl=C(cur.cls),n=0,nc=0,have={},bad=false;

var ART='ARRÊTÉ — DISPOSITIONS RELATIVES AUX ÉDUCATEURS ET AUX APPRENANTS (extraits)\n\nArticle 20 : Il est infligé une mise à pied avec suspension de salaire pour une durée de 15 jours à tout(e) éducateur(rice) qui entretient des relations coupables avec un(e) apprenant(e). En cas de récidive, il lui est infligé une mise à pied avec suspension de salaire pour une durée d’un mois.\n\nArticle 21 : Tout éducateur reconnu auteur de grossesse constatée sur une apprenante est temporairement exclu de ses fonctions pour une durée de 6 mois avec suspension de salaire. En cas de récidive, il est révoqué de ses fonctions sans suspension des droits à la pension.\n\nArticle 22 : Tout(e) éducateur(rice) reconnu(e) coupable de tentative d’avortement ou d’incitation à l’avortement sur une apprenante est rétrogradé(e) de deux échelons. En cas de récidive, l’intéressé(e) est révoqué(e) de ses fonctions avec perte de tous ses droits de pension.\n\nArticle 23 : Tout(e) éducateur(rice) reconnu(e) coupable de viol, de tentative de viol ou de pédophilie sur un(e) apprenant(e) est révoqué(e) de ses fonctions avec perte de tous ses droits à pension.\n\nArticle 24 : Pour le cas spécifique des éducateurs(rices) qui ne sont pas soumis(es) au statut général des agents permanents de l’État, notamment les enseignants communautaires et vacataires, reconnu(es) coupables de l’une des formes de violences énumérées au titre 2 du présent Arrêté, la sanction applicable est la résiliation sans condition de leur contrat, sans préjudice des poursuites dont l’initiation doit être prise par le Chef d’établissement.\n\nCHAPITRE III : DISPOSITIONS DIVERSES\n\nArticle 25 : Les personnes non visées par le présent Arrêté et qui sont présumées coupables de violences sexuelles sur un(e) apprenant(e) sont poursuivies devant les tribunaux.\n\nArticle 27 : Le présent Arrêté, qui prend effet à compter de la date de sa signature, abroge toutes dispositions antérieures contraires, notamment celles de la lettre circulaire n°063/MEMS/DGM/SPC du 15 février 1998.\n\nArticle 28 : L’Inspecteur Général Pédagogique du Ministère, le Directeur de l’Enseignement Technique, le Directeur des Ressources Humaines, le Directeur de la Formation Professionnelle, le Directeur de l’Apprentissage et de la Formation Professionnelle, le Directeur de l’Enseignement Secondaire Général et les Directeurs Départementaux des Enseignements Secondaire et de la Formation Technique et Professionnelle sont chargés, en ce qui les concerne, de l’application du présent arrêté qui sera publié au Journal officiel de la République du Bénin.\n\nLe Ministre de l’Enseignement Secondaire, de la Formation Technique et Professionnelle, de la Reconversion et de l’Insertion des Jeunes : Alassane SOUMANOU.';

function qpick(n,j,sk){var sid=$('#qs').value,E=FA.find(function(x){return x.n===n});if(!sid||!E)return;if(!sk&&E.r&&S.sanc.some(function(y){return y.sid===sid&&y.fn===n})){var R=FA.find(function(x){return x.n===E.r});$('#ms').innerHTML='<h2 style="margin-top:0">N° '+n+' · '+esc(E.m[+j])+'</h2><div class="mu">Cet élève a déjà été puni pour cette faute. Le règlement prévoit pour la récidive (n° '+E.r+') :</div><button style="width:100%;text-align:left;margin-top:8px" data-n="'+E.r+'" data-s="'+sid+'" onclick="qmk(this.dataset.n,0,0,this.dataset.s)">'+esc(R.o[0].p)+'</button><button class="ghost" style="width:100%;text-align:left;margin-top:8px" data-n="'+n+'" data-j="'+j+'" onclick="qpick(this.dataset.n,this.dataset.j,1)">Appliquer quand même la punition normale</button><button class="ghost" style="width:100%;margin-top:12px" onclick="$(\'#m\').classList.remove(\'open\')">Fermer</button>';$('#m').classList.add('open');return}if(E.o.length===1)return qmk(n,+j,0,sid);$('#ms').innerHTML='<h2 style="margin-top:0">N° '+n+' · '+esc(E.m[+j])+'</h2><div class="mu">Le règlement prévoit plusieurs punitions. Choisis :</div>'+E.o.map(function(o,k){return '<button class="ghost" style="width:100%;text-align:left;margin-top:8px" data-n="'+n+'" data-j="'+j+'" data-k="'+k+'" data-s="'+sid+'" onclick="qmk(this.dataset.n,+this.dataset.j,+this.dataset.k,this.dataset.s)">'+esc(o.p)+'</button>'}).join('')+'<button class="ghost" style="width:100%;margin-top:12px" onclick="$(\'#m\').classList.remove(\'open\')">Fermer</button>';$('#m').classList.add('open')}
function qmk(n,j,k,sid){var E=FA.find(function(x){return x.n===n}),o=E.o[k],f=findS(sid);if(!f)return;var due=o.ex?addDays(o.ex):o.cd?addDays(7):o.h?addDays(2):addDays(1),rc=S.sanc.filter(function(y){return y.sid===sid&&y.fn===n}).length,x={id:uid(),sid:sid,p:o.p,fn:n,fm:E.m[j],due:due,g:today(),h:o.h||0,c:o.c||0,ex:o.ex||0,cd:o.cd?1:0,done:false};S.sanc.push(x);save();
var msg='Bonjour, '+f.s.name+' (classe '+f.c.name+') a reçu une punition pour la faute « '+E.m[j]+' » : '+o.p+'.'+(S.me?' — '+S.me:'');cur.qm={id:x.id,t:f.s.name+' : '+o.p+(o.h?' ('+o.h+' h)':'')+' · avant le '+due+(rc>0?'. ⚠ Faute déjà sanctionnée '+rc+' fois'+(E.r?' : voir la récidive (n° '+E.r+')':'')+'.':''),u:waL(f.s.tel,msg)};$('#m').classList.remove('open');render()}

function roleUI(){var d=$('#rl');if(!d){d=document.createElement('div');d.id='rl';d.className='lkw';d.style.zIndex=9998;document.body.appendChild(d)}d.style.display='flex';d.style.overflowY='auto';d.style.justifyContent='flex-start';d.innerHTML='<div style="padding:24px 18px;width:100%;max-width:480px;box-sizing:border-box"><svg style="width:56px;height:56px"><use href="#logo"/></svg><h2 style="color:#fff;margin:10px 0 4px">Quel est ton rôle ?</h2><div style="color:#cfd8ea;font-size:13px;margin-bottom:12px">Il adapte les onglets affichés. Tu pourras le changer dans l’onglet Données.</div>'+Object.keys(RL).map(function(k){return '<button data-k="'+k+'" onclick="setRole(this.dataset.k)" style="width:100%;text-align:left;margin-top:8px;background:rgba(255,255,255,.12);color:#fff"><b>'+RL[k].n+'</b><br><small style="opacity:.8">'+RL[k].d+'</small></button>'}).join('')+'</div>'}

function nmFmt(n){var t=n.trim().replace(/\s+/g,' ').split(' ');if(t.length<2)return t.join(' ').toUpperCase();var i=0;while(i<t.length&&t[i]===t[i].toUpperCase()&&/[A-ZÀ-Ý]/.test(t[i]))i++;if(i===0||i===t.length)i=1;return t.slice(0,i).map(function(x){return x.toUpperCase()}).concat(t.slice(i).map(function(x){return x===x.toUpperCase()||x===x.toLowerCase()?x.toLowerCase().replace(/(^|[-’'])([a-zà-ÿ])/g,function(m,a,b){return a+b.toUpperCase()}):x})).join(' ')}

function purge(ids,cid){Object.keys(S.att).forEach(function(k){if(cid&&k.split('|')[1]===cid)delete S.att[k];else if(S.att[k]){for(var s in ids)delete S.att[k][s]}});S.inc=S.inc.filter(function(x){return !ids[x.sid]});S.sanc=S.sanc.filter(function(x){return !ids[x.sid]});S.notes=S.notes||{};Object.keys(S.notes).forEach(function(e){for(var s in ids)if(S.notes[e])delete S.notes[e][s]})}
