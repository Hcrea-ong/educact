function migrate(data){
  if(!data||typeof data!=='object')return null;

      for(var cid in data.mat){
        var mid=uid();
        data.mats[cid]=data.mats[cid]||[];
        data.mats[cid].push({id:mid,n:data.mat[cid],coef:data.coef&&data.coef[cid]?data.coef[cid]:1});
      }
      (data.eva||[]).forEach(function(e){
        if(!e.mid&&data.mats[e.cid]&&data.mats[e.cid][0])e.mid=data.mats[e.cid][0].id;
      });
    }
    data._v=2;
  }

    if(!data.waGroup)data.waGroup='';

  }

  var h=clsSel()+'<label>Élève</label><select id="is">'+c.students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select>';
  h+='<label>Mesure</label><select id="il">'+LV.map(function(l,i){return '<option value="'+i+'">'+(i+1)+'. '+esc(l)+'</option>'}).join('')+'</select>';
  h+='<label>Faits constatés</label><textarea id="if" placeholder="Décris les faits."></textarea>';
  h+='<div style="margin-top:8px"><button onclick="addInc()">Enregistrer</button></div>';
  h+='<h2>Derniers incidents</h2><div class="card">';
  var l=S.inc.slice().sort(function(a,b){return b.d>a.d?1:-1}).slice(0,15);
  if(!l.length)h+='<div class="mu">Aucun incident.</div>';
  l.forEach(function(x){
    var f=findS(x.sid);
    h+='<div class="st"><div class="nm"><b>'+esc(f?f.s.name:'Élève supprimé')+'</b><small>'+esc(x.d)+' · '+esc(LV[x.l]||'')+' — '+esc(x.f)+'</small></div></div>';
  });
  return h+'</div>';
}
function addInc(){
  var sid=$('#is').value,f=$('#if').value.trim();
  if(!sid||!f){$('#if').focus();return}
  S.inc.push({id:uid(),sid:sid,d:today(),l:+$('#il').value,f:f});
  save();render();toast('Incident enregistré.');
}

function overdue(){return S.sanc.filter(function(x){return !x.done&&x.due<today()})}
function inR(d){return d>=cur.bf&&d<=cur.bt}
function hrs(sid,all){
  var t=0,d=0;
  S.sanc.forEach(function(x){
    if(x.sid===sid&&(all||inR(x.g||x.due))){t+=x.h||0;if(x.done)d+=x.h||0}
  });
  return {t:r1(t),d:r1(d)};
}
function vPun(){
  var c=C(cur.cls),o=overdue().length,h='';
  if(o)h+='<div class="alarm" style="cursor:default">⚠ '+o+' punition(s) en retard</div>';
  h+=qpCard();
  h+='<div class="card"><b>Punition libre</b>';
  if(!c)h+='<div class="mu">Crée une classe.</div></div>';
  else h+=clsSel()
    +'<label>Élève</label><select id="ps">'+c.students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select>'
    +'<label>Punition</label><select id="pp">'+S.pun.map(function(p){return '<option>'+esc(p)+'</option>'}).join('')+'</select>'
    +'<label>Retenue en h (facultatif)</label><input id="ph" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0">'
    +'<label>Avant le</label><input id="pd" type="date" value="'+addDays(2)+'">'
    +'<div style="margin-top:8px"><button onclick="addPun()">Enregistrer</button></div></div>';
  h+='<div class="card"><b>Ajouter à la liste</b><div class="row" style="margin-top:8px"><input id="pn" placeholder="Ex. Ramasser les papiers"><button onclick="addCat()">Ajouter</button></div></div>';
  h+='<h2>À exécuter</h2><div class="card">';
  var p=S.sanc.filter(function(x){return !x.done}).sort(function(a,b){return a.due>b.due?1:-1});
  if(!p.length)h+='<div class="mu">Aucune punition en attente.</div>';
  p.forEach(function(x){
    var f=findS(x.sid),late=x.due<today(),td=x.due===today();
    h+='<div class="st"><div class="nm"><b>'+esc(f?f.s.name:'Supprimé')+'</b>'
      +'<small>'+px(x)+' · avant le '+esc(x.due)+'</small>'
      +'<span class="bd'+(late?' w':'')+'">'+(late?'En retard':td?'Aujourd\'hui':'À faire')+'</span></div>'
      +'<button onclick="donePun(\''+x.id+'\')">Exécutée</button></div>';
  });
  h+='</div>';
  var d=S.sanc.filter(function(x){return x.done}).slice(-10).reverse();
  if(d.length)h+='<h2>Exécutées</h2><div class="card">'+d.map(function(x){
    var f=findS(x.sid);
    return '<div class="st"><div class="nm">'+esc(f?f.s.name:'Supprimé')+'<small>'+px(x)+' · '+esc(x.dd||'')+'</small></div></div>';
  }).join('')+'</div>';
  return h;
}
function addPun(){
  var s=$('#ps');if(!s||!s.value)return;
  S.sanc.push({id:uid(),sid:s.value,p:$('#pp').value,due:$('#pd').value||addDays(2),g:today(),h:Math.max(0,parseFloat($('#ph').value)||0),done:false});
  save();render();toast('Punition enregistrée.');
}
function donePun(id){var x=S.sanc.find(function(y){return y.id===id});if(x){x.done=true;x.dd=today();save();render()}}
function addCat(){var n=$('#pn').value.trim();if(n&&S.pun.indexOf(n)<0){S.pun.push(n);save();render()}}
function px(x){
  return (x.fm?'<b>N° '+x.fn+'</b> · '+esc(x.fm)+'<br>':'')+esc(x.p)
    +(x.h?' ('+x.h+' h)':'')+(x.c?' · −'+x.c+' pt':'')+(x.cd?' · conseil':'');
}
function qpCard(){
  var c=C(cur.cls);if(!c)return '';
  var m=cur.qm;
  var h='<div class="card"><b>Punition rapide</b><div class="mu" style="margin:4px 0 8px">Choisis l\'élève, touche le motif.</div>'
    +clsSel()+'<label>Élève</label><select id="qs">'
    +c.students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')
    +'</select>';
  if(m)h+='<div class="alarm" style="cursor:default;margin-top:10px;background:#e7f6ec;color:#14532d">✓ '+esc(m.t)
    +' <a onclick="qundo()" style="text-decoration:underline;margin-left:6px">Annuler</a>'
    +(m.u?' <a target="_blank" rel="noopener" href="'+m.u+'" style="text-decoration:underline;margin-left:6px">Prévenir</a>':'')
    +'</div>';
  h+='<button class="ghost" style="width:100%;margin-top:10px" onclick="fxUI()">＋ Compléter</button>'
    +'<input type="search" placeholder="Chercher un motif…" value="'+esc(cur.qs||'')+'" oninput="cur.qs=this.value;qfill()" style="margin-top:10px">'
    +'<div id="ql"></div></div>';
  return h;
}
function qfill(){
  var el=$('#ql');if(!el)return;
  var q=(cur.qs||'').toLowerCase(),h='';
  FAA().forEach(function(e){
    e.m.forEach(function(m,j){
      if(q&&(e.n+' '+m+' '+e.o.map(function(o){return o.p}).join(' ')).toLowerCase().indexOf(q)<0)return;
      h+='<button class="ghost" style="width:100%;text-align:left;margin-top:6px" data-n="'+e.n+'" data-j="'+j+'" onclick="qpick(this.dataset.n,this.dataset.j)"><b>'+e.n+'</b> · '+esc(m)+'</button>';
    });
  });
  el.innerHTML=h||'<div class="mu">Aucun motif.</div>';
}
function FAA(){return FA.concat(S.fx||[])}
function qpick(n,j,sk){
  var sid=$('#qs').value,E=FAA().find(function(x){return x.n===n});
  if(!sid||!E)return;
  if(!sk&&E.r&&S.sanc.some(function(y){return y.sid===sid&&y.fn===n})){
    var R=FAA().find(function(x){return x.n===E.r});
    $('#ms').innerHTML='<h2 style="margin-top:0">N° '+n+' · '+esc(E.m[+j])+'</h2>'
      +'<div class="mu">Déjà puni. Récidive (n° '+E.r+') :</div>'
      +'<button style="width:100%;text-align:left;margin-top:8px" data-n="'+E.r+'" data-s="'+sid+'" onclick="qmk(this.dataset.n,0,0,this.dataset.s)">'+esc(R.o[0].p)+'</button>'
      +'<button class="ghost" style="width:100%;text-align:left;margin-top:8px" data-n="'+n+'" data-j="'+j+'" onclick="qpick(this.dataset.n,this.dataset.j,1)">Appliquer quand même</button>'
      +'<button class="ghost" style="width:100%;margin-top:12px" onclick="$(\'#m\').classList.remove(\'open\')">Fermer</button>';
    $('#m').classList.add('open');return;
  }
  if(E.o.length===1)return qmk(n,+j,0,sid);
  $('#ms').innerHTML='<h2 style="margin-top:0">N° '+n+' · '+esc(E.m[+j])+'</h2>'
    +'<div class="mu">Choisis :</div>'
    +E.o.map(function(o,k){
      return '<button class="ghost" style="width:100%;text-align:left;margin-top:8px" data-n="'+n+'" data-j="'+j+'" data-k="'+k+'" data-s="'+sid+'" onclick="qmk(this.dataset.n,+this.dataset.j,+this.dataset.k,this.dataset.s)">'+esc(o.p)+'</button>';
    }).join('')
    +'<button class="ghost" style="width:100%;margin-top:12px" onclick="$(\'#m\').classList.remove(\'open\')">Fermer</button>';
  $('#m').classList.add('open');
}
function qmk(n,j,k,sid){
  var E=FAA().find(function(x){return x.n===n}),o=E.o[k],f=findS(sid);
  if(!f)return;
  var due=o.ex?addDays(o.ex):o.cd?addDays(7):o.h?addDays(2):addDays(1);
  var rc=S.sanc.filter(function(y){return y.sid===sid&&y.fn===n}).length;
  var x={id:uid(),sid:sid,p:o.p,fn:n,fm:E.m[j],due:due,g:today(),h:o.h||0,c:o.c||0,ex:o.ex||0,cd:o.cd?1:0,done:false};
  S.sanc.push(x);
  /* === FIN DE qmk() RECONSTITUÉE (le texte d'origine était coupé ici) === */
  var msg='Bonjour, ici '+(S.me||'l\'administration')+(S.ecole?' ('+S.ecole+')':'')+'. Votre enfant '+f.s.name+' (classe '+f.c.name+') a reçu une punition : '+o.p+(rc?' (récidive)':'')+'.';
  cur.qm={t:f.s.name+' : '+o.p,u:waL(f.s.tel,msg),id:x.id};
  save();$('#m').classList.remove('open');render();toast('Punition enregistrée.');
}
function qundo(){
  if(!cur.qm)return;
  S.sanc=S.sanc.filter(function(y){return y.id!==cur.qm.id});
  cur.qm=null;save();render();
}

/* ========== PARTIE 3 : notes, bilans, point nominatif ========== */
var TY=[['I','Interrogation'],['D','Devoir']];
function tyN(t){var x=TY.find(function(y){return y[0]===t});return x?x[1]:'Devoir'}
function tcls(){var a=S.classes.filter(function(c){return c.t});return a.length?a:S.classes}
function gcl(){var a=tcls(),c=a.find(function(x){return x.id===cur.gc})||a[0]||null;cur.gc=c?c.id:'';return c}
function getMats(cid){return S.mats[cid]||[]}
function curMat(){
  var c=gcl();if(!c)return null;
  var mats=getMats(c.id);
  if(!mats.length)return null;
  var m=mats.find(function(x){return x.id===cur.gm});
  if(!m){m=mats[0];cur.gm=m.id}
  return m;
}
function addMat(){
  var c=gcl();if(!c)return;
  var n=$('#mn').value.trim(),k=parseFloat(String($('#mc').value).replace(',','.'))||1;
  if(!n){$('#mn').focus();return}
  S.mats[c.id]=S.mats[c.id]||[];
  S.mats[c.id].push({id:uid(),n:n,coef:k>0?k:1});
  save();render();
}
function calc(c,per){
  var mat=curMat();
  if(!c||!mat)return null;
  var ev=S.eva.filter(function(e){return e.cid===c.id&&e.per===per&&e.mid===mat.id});
  var I=ev.filter(function(e){return e.t==='I'}),Dv=ev.filter(function(e){return e.t!=='I'}).slice(0,2);
  function nn(e,sid){
    var v=(S.notes[e.id]||{})[sid];
    if(v==='A'&&S.zabs)return 0;
    return typeof v==='number'?v/e.m*20:null;
  }
  var k=mat.coef||1;
  var rows=c.students.map(function(s){
    var iv=I.map(function(e){return nn(e,s.id)}).filter(function(x){return x!==null});
    var mi=iv.length?iv.reduce(function(a,b){return a+b},0)/iv.length:null;
    var d=Dv.map(function(e){return nn(e,s.id)});
    var parts=[mi].concat(d).filter(function(x){return x!==null});
    var ms=parts.length?parts.reduce(function(a,b){return a+b},0)/parts.length:null;
    return {id:s.id,n:s.name,mi:mi,d:d,m:ms,mc:ms===null?null:ms*k};
  });
  var sc=rows.filter(function(r){return r.m!==null}).map(function(r){return r.m}).sort(function(a,b){return b-a});
  rows.forEach(function(r){r.r=r.m===null?null:sc.indexOf(r.m)+1});
  return {ev:ev,I:I,D:Dv,k:k,rows:rows,sc:sc,mat:mat};
}
function sortR(rows){return rows.slice().sort(function(a,b){return (b.m===null?-1:b.m)-(a.m===null?-1:a.m)})}
function cnt(e){var m=S.notes[e.id]||{},n=0;for(var k in m)if(typeof m[k]==='number')n++;return n+' note(s)'}
function vNotes(){
  if(!S.classes.length)return none();
  cur.gp=cur.gp==='2'?'2':'1';
  var c=gcl();
  var h='<div class="card" style="margin-top:10px"><details'+(cur.dt?' open':'')+'><summary>Mes classes d\'enseignement</summary>'
    +'<div class="mu" style="margin:6px 0">Coche celles où tu enseignes.</div>'
    +S.classes.map(function(x){
      return '<label style="display:flex;gap:10px;align-items:center;margin:6px 0;color:var(--tx)"><input type="checkbox" style="width:auto" data-i="'+x.id+'"'+(x.t?' checked':'')+' onchange="togT(this.dataset.i)">'+esc(x.name)+'</label>';
    }).join('')+'</details></div>';
  if(!c)return h;
  h+='<div class="row"><div><label>Classe</label><select onchange="cur.gc=this.value;cur.gm=\'\';cur.ne=\'\';render()">'
    +tcls().map(function(x){return '<option value="'+x.id+'"'+(x.id===c.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')
    +'</select></div><div><label>Semestre</label><select onchange="cur.gp=this.value;cur.ne=\'\';render()">'
    +['1','2'].map(function(p){return '<option value="'+p+'"'+(cur.gp===p?' selected':'')+'>Semestre '+p+'</option>'}).join('')
    +'</select></div></div>';
  var mats=getMats(c.id);
  if(!mats.length){
    h+='<div class="card"><b>Matière enseignée</b>'
      +'<div class="mu" style="margin:4px 0 8px">Ajoute la matière que tu enseignes ici.</div>'
      +'<label>Nom</label><input id="mn" placeholder="Ex. Mathématiques">'
      +'<label>Coefficient</label><input id="mc" type="number" min="0.5" step="0.5" value="1" inputmode="decimal">'
      +'<div style="margin-top:8px"><button onclick="addMat()">Ajouter</button></div></div>';
    return h;
  }
  h+='<div class="row"><div><label>Matière</label><select onchange="cur.gm=this.value;cur.ne=\'\';render()">'
    +mats.map(function(m){return '<option value="'+m.id+'"'+(m.id===cur.gm?' selected':'')+'>'+esc(m.n)+' (coef '+m.coef+')</option>'}).join('')
    +'</select></div><div style="flex:0 0 auto"><label>&nbsp;</label><button class="ghost" onclick="cur.mn=1;render()">＋</button></div></div>';
  if(cur.mn){
    h+='<div class="card"><b>Nouvelle matière</b><label>Nom</label><input id="mn" placeholder="Ex. Physique">'
      +'<label>Coefficient</label><input id="mc" type="number" min="0.5" step="0.5" value="1" inputmode="decimal">'
      +'<div class="row" style="margin-top:8px"><button onclick="addMat();cur.mn=0">Ajouter</button><button class="ghost" onclick="cur.mn=0;render()">Annuler</button></div></div>';
  }
  var mat=curMat();
  if(!mat)return h;
  var D=calc(c,cur.gp);
  h+='<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" '+(S.zabs?'checked ':'')+'onchange="S.zabs=this.checked;save();render()"> Compter « A » comme zéro</label>';
  h+='<h2>Évaluations · '+esc(mat.n)+'</h2>';
  if(!D.ev.length)h+='<div class="card empty">Aucune évaluation.</div>';
  D.ev.forEach(function(e){
    var vals=c.students.map(function(s){return (S.notes[e.id]||{})[s.id]}).filter(function(v){return typeof v==='number'});
    var av=vals.length?vals.reduce(function(a,b){return a+b/e.m*20},0)/vals.length:null;
    h+='<div class="card"><b>'+esc(e.n)+'</b> <span class="mu">· '+tyN(e.t)+' · sur '+e.m+(e.d?' · '+esc(e.d):'')+'</span>'
      +'<div class="mu">'+vals.length+' note(s) · moyenne '+f2(av)+'/20</div>'
      +'<div class="row" style="margin-top:8px"><button data-i="'+e.id+'" onclick="selE(this.dataset.i)">'+(cur.ne===e.id?'Fermer':'Saisir')+'</button>'
      +'<button class="ghost" data-i="'+e.id+'" onclick="delE(this.dataset.i)">'+(cur.dc===e.id?'Confirmer':'Supprimer')+'</button></div></div>';
    if(cur.ne===e.id)h+=gridN(c,e);
  });
  h+='<div class="card"><b>Nouvelle évaluation</b>'
    +'<label>Nom</label><input id="en" placeholder="Ex. Interrogation 1">'
    +'<div class="row"><div><label>Type</label><select id="et2">'+TY.map(function(t){return '<option value="'+t[0]+'">'+t[1]+'</option>'}).join('')+'</select></div>'
    +'<div><label>Sur</label><input id="em" type="number" value="20" min="1" inputmode="decimal"></div></div>'
    +'<label>Date</label><input id="ed" type="date" value="'+today()+'">'
    +'<div style="margin-top:8px"><button onclick="addE()">Créer</button></div><div id="ge" class="mu" style="margin-top:6px"></div></div>';
  h+='<h2>Moyennes · '+esc(c.name)+' · '+esc(mat.n)+' · Semestre '+cur.gp+'</h2>';
  if(!D.ev.length)return h+'<div class="card empty">Crée une évaluation.</div>';
  var T=D.sc.length,avg=T?D.sc.reduce(function(a,b){return a+b},0)/T:null,ks=String(D.k).replace('.',',');
  var rs=sortR(D.rows);
  h+='<div class="mu" style="margin:6px 0">Moyenne = (moy. int. + devoir 1 + devoir 2) ÷ 3, × coefficient '+ks+'.</div>'
    +'<div class="sum"><span>Classe '+f2(avg)+'</span><span>Max '+f2(T?D.sc[0]:null)+'</span><span class="A">Min '+f2(T?D.sc[T-1]:null)+'</span></div>'
    +'<div class="mu" style="margin:6px 0">'+T+' noté(s) sur '+c.students.length+' · réussite : '+(T?Math.round(D.sc.filter(function(x){return x>=10}).length/T*100)+' %':'–')+'</div>';
  h+='<div class="card tbw"><table class="tb"><tr><th>Élève</th><th>Moy. int.</th><th>Dev. 1</th><th>Dev. 2</th><th>Moy. sem.</th><th>× coef. '+ks+'</th><th>Rang</th></tr>'
    +rs.map(function(r){return '<tr><td>'+esc(r.n)+'</td><td>'+f2(r.mi)+'</td><td>'+f2(r.d[0])+'</td><td>'+f2(r.d[1])+'</td><td'+(r.m!==null&&r.m<10?' style="color:var(--ab)"':'')+'>'+f2(r.m)+'</td><td>'+f2(r.mc)+'</td><td>'+(r.r||'–')+'</td></tr>'}).join('')
    +'</table></div>';
  var txt='Moyennes '+c.name+' ('+mat.n+') - Semestre '+cur.gp+'\nMoyenne de classe : '+f2(avg)+'/20\n'
    +rs.filter(function(r){return r.m!==null}).map(function(r){return r.r+'. '+r.n+' : '+f2(r.m)}).join('\n');
  h+='<div class="row" style="margin-top:10px"><button onclick="prt()">Imprimer</button><button class="ghost" onclick="xlN()">Excel</button>'
    +'<a class="btn" style="margin:0;flex:1" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">WhatsApp</a></div>'
    +'<div id="gm" class="mu" style="margin-top:8px"></div>';
  return h;
}
function togT(id){var c=C(id);if(c){c.t=!c.t;cur.dt=true;save();render()}}
function gridN(c,e){
  var h='<div class="card">'+impUI(e)+'<div class="mu" style="margin-bottom:6px">Note sur '+e.m+'. Vide = non noté, A = absent.</div>';
  c.students.forEach(function(s){
    var v=(S.notes[e.id]||{})[s.id];
    h+='<div class="st"><div class="nm">'+esc(s.name)+'</div>'
      +'<input style="width:84px;text-align:center" inputmode="decimal" data-e="'+e.id+'" data-s="'+s.id+'" value="'+(v==null?'':String(v).replace('.',','))+'" onchange="setN(this)"></div>';
  });
  return h+'<div id="gc" class="mu" style="margin-top:8px">'+cnt(e)+'</div></div>';
}
function setN(el){
  var e=S.eva.find(function(x){return x.id===el.dataset.e});if(!e)return;
  var t=el.value.trim().replace(',','.'),m=S.notes[e.id]=S.notes[e.id]||{},sid=el.dataset.s;
  if(!t)delete m[sid];
  else if(/^a(bs)?$/i.test(t)){m[sid]='A';el.value='A'}
  else{
    var v=parseFloat(t);
    if(isNaN(v)){el.value='';delete m[sid]}
    else{v=Math.min(e.m,Math.max(0,v));m[sid]=v;el.value=String(v).replace('.',',')}
  }
  save();
  var g=$('#gc');if(g)g.textContent=cnt(e);
}
function impUI(e){
  return '<details style="margin-bottom:10px"'+(cur.im?' open':'')+'><summary><b>Importer des notes</b></summary>'
    +'<div class="mu" style="margin:6px 0">« NOM Prénom note », une ligne par élève. A = absent.</div>'
    +'<textarea id="ib" placeholder="ABDOULAYE Moussilimatou 14,5"></textarea>'

    +'<label class="fl">Ou fichier<input type="file" accept=".xlsx,.xls,.csv,.txt" data-i="'+e.id+'" onchange="impFN(this)"></label>'

function impT(id,text){
  var e=S.eva.find(function(x){return x.id===id}),c=gcl();
  if(!e||!c)return;
  var m=S.notes[id]=S.notes[id]||{},ok=0,bad=[],idx=0;
  text.split(/\r?\n/).forEach(function(l){
    var cells=l.split(/\t|;/).map(function(x){return x.trim()}).filter(Boolean);
    if(!cells.length)return;
    if(cells.length===1){
      var sp=cells[0].split(/\s+/);
      cells=[sp.slice(0,-1).join(' '),sp[sp.length-1]];
    }
    var raw=cells[cells.length-1].replace(',','.'),A=/^a(bs)?$/i.test(raw);
    if(!A&&!/^\d+(\.\d+)?$/.test(raw))return;
    var nm=cells.slice(0,-1).join(' '),tk=nt(nm),s=null;
    if(tk.length){
      var b=0;
      c.students.forEach(function(x){
        var st=nt(x.name),h=st.filter(function(k){return tk.indexOf(k)>-1}).length;
        if(st.length&&h===st.length&&h>b){b=h;s=x}
      });
    }else s=c.students[idx];
    idx++;
    if(!s){bad.push(nm||('ligne '+idx));return}
    m[s.id]=A?'A':Math.min(e.m,Math.max(0,parseFloat(raw)));ok++;
  });
  cur.im=ok+' importée(s)'+(bad.length?' · non reconnu : '+bad.slice(0,8).join(', '):'')+'.';
  save();render();
}

  setInterval(function(){if(sess())syncNow()},300000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
</script>
