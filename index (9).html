  var m=$('#im'),L=$('#ns').value.split(/\r?\n/),cl=C(cur.cls),n=0,nc=0,up=0,bad=false;
  var mi=mtCol(L.map(function(l){return l.split(/[;,\t]/)}));
  var HR=/^([3-6]\s*(ème|eme|ième|ieme|è|e)|2nde|2de|seconde|1ère|1ere|première|premiere|tle|terminale)(?![a-zà-ÿ])/i;
  L.forEach(function(l){
    l=l.trim();if(!l)return;
    if(l.length<30&&HR.test(l)){
      cl=S.classes.find(function(x){return x.name.toLowerCase()===l.toLowerCase()});
      if(!cl){cl={id:uid(),name:l,students:[]};S.classes.push(cl);nc++}
      return;
    }
    var o=studRow(l.split(/[;,\t]/),mi);
    if(!o)return;
    o.name=o.name.replace(/^[•*\-–]\s*/,'').replace(/^\d+\s*[.)\-–:]\s*/,'').trim();
    if(!o.name)return;
    if(!cl){bad=true;return}
    var r=addStud(cl,o);if(r===1)n++;else if(r===2)up++;
  });
  if(!n&&!nc&&!up){m.textContent=bad?'Crée une classe d\'abord.':'Aucun nom trouvé.';return}
  if(!cur.cls&&S.classes[0])cur.cls=S.classes[0].id;
  save();buildIndex();render();$('#im').textContent=nc+' classe(s), '+n+' élève(s)'+(up?', '+up+' matricule(s) ajouté(s)':'')+'.';
}
function addCls(){var n=$('#nc').value.trim();if(!n)return;var c={id:uid(),name:n,students:[]};S.classes.push(c);cur.cls=c.id;save();buildIndex();render()}

  }
  dates.sort().reverse();
  var inc=S.inc.filter(function(x){return x.sid===sid}).sort(function(a,b){return b.d>a.d?1:-1});
  var msg='Bonjour, ici '+(S.me||'l\'administration')+(S.ecole?' ('+S.ecole+')':'')+'. Votre enfant '+f.s.name+' totalise '+t.a+' absence(s), '+t.r+' retard(s)'+(t.m?' et '+t.m+' maladie(s)':'')+'. Merci de passer à la surveillance.';
  var h='<h2 style="margin-top:0">'+esc(f.s.name)+'</h2><div class="mu">'+esc(f.c.name)+'</div>'

    +'<div class="sum"><span class="A">'+t.a+' absences</span><span class="R">'+t.r+' retards</span>'
    +(t.m?'<span class="M">'+t.m+' maladies</span>':'')
    +'<span>'+t.i+' incidents</span></div>';
  if(t.a>=3)h+='<div class="card" style="color:var(--ab)">Alerte : 3 absences ou plus.</div>';
  h+='<h2>Incidents</h2><div class="card">'+(inc.length?inc.map(function(x){

  }).join(''):'<div class="mu">Aucun incident.</div>')+'</div>';

  h+='<h2>Punitions · retenue '+hh.t+' h ('+hh.d+' h faites)</h2><div class="card">'+(sc.length?sc.map(function(x){
    return '<div class="st"><div class="nm">'+esc(x.p)+(x.h?' ('+x.h+' h)':'')+'<small>Échéance '+esc(x.due)+'</small></div>'
      +'<span class="bd'+(!x.done&&x.due<today()?' w':'')+'">'+(x.done?'Exécutée':x.due<today()?'En retard':'À faire')+'</span></div>';
  }).join(''):'<div class="mu">Aucune punition.</div>')+'</div>';

  h+='<div class="row"><div><label>Sexe</label><select onchange="setF(\''+sid+'\',\'sx\',this.value)">'+opt(['','Masculin','Féminin'],f.s.sx)+'</select></div>'
    +'<div><label>Redoublant</label><select onchange="setF(\''+sid+'\',\'rd\',this.value)">'+opt(['','Non','Oui'],f.s.rd)+'</select></div></div>';

/* ===== Supprimer élèves et classes ===== */
function purgeSt(ids){
  var set={};ids.forEach(function(i){set[i]=1});
  S.inc=S.inc.filter(function(x){return !set[x.sid]});
  S.sanc=S.sanc.filter(function(x){return !set[x.sid]});
  Object.keys(S.notes||{}).forEach(function(e){ids.forEach(function(i){if(S.notes[e])delete S.notes[e][i]})});
  Object.keys(S.att||{}).forEach(function(k){ids.forEach(function(i){if(S.att[k]&&S.att[k][i]!==undefined)delete S.att[k][i]});if(S.att[k]&&!Object.keys(S.att[k]).length)delete S.att[k]});
}
function delSt(sid){
  var f=findS(sid);if(!f)return;
  var t=stats(sid);
  if(!confirm('Supprimer '+f.s.name+' de la classe '+f.c.name+' ?\n\nSes absences ('+t.a+'), incidents ('+t.i+'), punitions et notes seront supprimés. Les points quotidiens déjà archivés gardent son nom.\n\nUne copie de sécurité est faite avant.'))return;
  snap(true);
  f.c.students=f.c.students.filter(function(x){return x.id!==sid});
  purgeSt([sid]);
  save();buildIndex();closeD();render();
  toast(f.s.name+' supprimé. Copie de sécurité faite.');
}
function delCls(cid){
  var c=C(cid);if(!c)return;
  var n=c.students.length;
  if(!confirm('Supprimer la classe '+c.name+' et ses '+n+' élève(s) ?\n\nLeurs absences, incidents, punitions et notes seront supprimés. Les points quotidiens déjà archivés restent consultables.\n\nUne copie de sécurité est faite avant.'))return;
  if(n>=5&&!confirm('Dernière confirmation : supprimer définitivement '+c.name+' ?'))return;
  snap(true);
  purgeSt(c.students.map(function(s){return s.id}));
  S.eva=S.eva.filter(function(e){if(e.cid===cid){delete S.notes[e.id];return false}return true});
  Object.keys(S.att||{}).forEach(function(k){if(k.split('|')[1]===cid)delete S.att[k]});
  S.classes=S.classes.filter(function(x){return x.id!==cid});
  if(cur.cls===cid)cur.cls=(S.classes[0]||{}).id||'';
  save();buildIndex();render();
  toast('Classe '+c.name+' supprimée. Copie de sécurité faite.');
}
/* ===== Renommer élèves et classes ===== */
function cleanNm(v){return String(v==null?'':v).replace(/\s+/g,' ').trim()}
function renCls(cid,v){
  var c=C(cid);if(!c)return;
  v=cleanNm(v);
  if(!v){toast('Le nom ne peut pas être vide.');return}
  if(v===c.name)return;
  var nk=ck(v),ok=ck(c.name);
  if(!nk){toast('Nom invalide.');return}
  if(S.classes.some(function(x){return x.id!==cid&&ck(x.name)===nk})){toast('Une classe porte déjà ce nom.');return}
  var old=c.name;c.name=v;
  if(nk!==ok){
    var P=S.pj||{};
    Object.keys(P).forEach(function(d){var D=P[d];if(D[ok]&&!D[nk]){D[nk]=D[ok];D[nk].c=v;delete D[ok]}});
    var A=S.apr||{};
    Object.keys(A).forEach(function(k){
      if(k.indexOf(ok+'|')!==0)return;
      var n2=nk+k.slice(ok.length);
      if(A[n2]===undefined){A[n2]=A[k];delete A[k]}
    });
    if(cur.bc===ok)cur.bc=nk;
    if(S.sch&&S.sch.cls&&S.sch.cls.indexOf(ok)>-1)S.sch.cls=S.sch.cls.map(function(x){return x===ok?nk:x});
  }else{
    var P2=S.pj||{};
    Object.keys(P2).forEach(function(d){if(P2[d][ok])P2[d][ok].c=v});
  }
  cur.q='';
  save();buildIndex();render();
  toast('Classe renommée : '+old+' → '+v+'.');
}
function renSt(sid,v){
  var f=findS(sid);if(!f)return;
  v=cleanNm(v);
  if(!v){toast('Le nom ne peut pas être vide.');return}
  var old=f.s.name;
  if(v===old)return;
  if(f.c.students.some(function(x){return x.id!==sid&&x.name.toLowerCase()===v.toLowerCase()})&&!confirm('Un autre élève porte déjà ce nom dans cette classe. Continuer ?'))return;
  f.s.name=v;
  // points quotidiens archivés : on corrige le nom dans la classe de l'élève
  var kc=ptKey(f.c),P=S.pj||{};
  Object.keys(P).forEach(function(d){
    var r=P[d][kc];if(!r)return;
    ['A','R','M'].forEach(function(t){r[t]=(r[t]||[]).map(function(n){return n===old?v:n})});
  });
  // appréciations, fusions de noms : clés construites à partir du nom
  var ok=sk(old),nk=sk(v);
  if(ok!==nk&&!f.s.mt){
    var cc=ck(f.c.name),A=S.apr||{};
    Object.keys(A).forEach(function(k){
      var q=k.split('|');
      if(q[0]===cc&&q[2]===ok){q[2]=nk;var n2=q.join('|');if(A[n2]===undefined){A[n2]=A[k];delete A[k]}}
    });
    var L=S.alias||{};
    Object.keys(L).forEach(function(k){
      var val=L[k],nkk=k===ok?nk:k,nv=val===ok?nk:val;
      if(nkk!==k||nv!==val){delete L[k];L[nkk]=nv}
    });
    var N=S.noDup||{};
    Object.keys(N).forEach(function(k){
      var q=k.split('|').map(function(x){return x===ok?nk:x}),n2=q.join('|');
      if(n2!==k){delete N[k];N[n2]=1}
    });
  }
  save();buildIndex();render();
  if($('#m')&&$('#m').classList.contains('open'))openD(sid);
  toast('Élève renommé : '+old+' → '+v+'.');
}
function setMt(sid,v){
  var f=findS(sid);if(!f)return;
  v=String(v||'').replace(/\s+/g,'').toUpperCase();
  if(v&&f.c.students.some(function(x){return x.id!==sid&&x.mt&&ck(x.mt)===ck(v)})){toast('Ce matricule existe déjà dans la classe.');return}
  if(v)f.s.mt=v;else delete f.s.mt;
  save();toast('Matricule enregistré.');
}

function overdue(){return S.sanc.filter(function(x){return !x.done&&x.due<today()})}
function inR(d){return d>=cur.bf&&d<=cur.bt}
function hrs(sid,all){
  var t=0,d=0;
  S.sanc.forEach(function(x){
    if(x.sid===sid&&(all||inR(x.g||x.due))){t+=x.h||0;if(x.done)d+=x.h||0}
  });
  return {t:r1(t),d:r1(d)};
}

function FAA(){return FA.concat(S.fx||[])}
function qpick(n,j,sk){
  var sid=$('#qs').value,E=FAA().find(function(x){return x.n===n});
  if(!sid||!E)return;
  if(!sk&&E.r&&S.sanc.some(function(y){return y.sid===sid&&y.fn===n})){
    var R=FAA().find(function(x){return x.n===E.r});
    $('#ms').innerHTML='<h2 style="margin-top:0">N° '+n+' · '+esc(E.m[+j])+'</h2>'
      +'<div class="mu">Déjà puni. Récidive (n° '+E.r+') :</div>'
      +'<button style="width:100%;text-align:left;margin-top:8px" data-n="'+E.r+'" data-s="'+sid+'" onclick="qmk(this.dataset.n,0,0,this.dataset.s)">'+esc(R.o[0].p)+'</button>'
      +'<button class="ghost" style="width:100%;text-align:left;margin-top:8px" data-n="'+n+'" data-j="'+j+'" onclick="qpick(this.dataset.n,this.dataset.j,1)">Appliquer quand même</button>'
      +'<button class="ghost" style="width:100%;margin-top:12px" onclick="$(\'#m\').classList.remove(\'open\')">Fermer</button>';
    $('#m').classList.add('open');return;
  }
  if(E.o.length===1)return qmk(n,+j,0,sid);
  $('#ms').innerHTML='<h2 style="margin-top:0">N° '+n+' · '+esc(E.m[+j])+'</h2>'
    +'<div class="mu">Choisis :</div>'
    +E.o.map(function(o,k){
      return '<button class="ghost" style="width:100%;text-align:left;margin-top:8px" data-n="'+n+'" data-j="'+j+'" data-k="'+k+'" data-s="'+sid+'" onclick="qmk(this.dataset.n,+this.dataset.j,+this.dataset.k,this.dataset.s)">'+esc(o.p)+'</button>';
    }).join('')
    +'<button class="ghost" style="width:100%;margin-top:12px" onclick="$(\'#m\').classList.remove(\'open\')">Fermer</button>';
  $('#m').classList.add('open');
}
function qmk(n,j,k,sid){
  var E=FAA().find(function(x){return x.n===n}),o=E.o[k],f=findS(sid);
  if(!f)return;
  var due=o.ex?addDays(o.ex):o.cd?addDays(7):o.h?addDays(2):addDays(1);
  var rc=S.sanc.filter(function(y){return y.sid===sid&&y.fn===n}).length;
  var x={id:uid(),sid:sid,p:o.p,fn:n,fm:E.m[j],due:due,g:today(),h:o.h||0,c:o.c||0,ex:o.ex||0,cd:o.cd?1:0,done:false};
  S.sanc.push(x);
  /* === FIN DE qmk() RECONSTITUÉE (le texte d'origine était coupé ici) === */

function calc(c,per,mat0){
  var mat=mat0||curMat();
  if(!c||!mat)return null;
  var ev=S.eva.filter(function(e){return e.cid===c.id&&e.per===per&&e.mid===mat.id});
  var I=ev.filter(function(e){return e.t==='I'}),Dv=ev.filter(function(e){return e.t!=='I'}).slice(0,2);
  function nn(e,sid){
    var v=(S.notes[e.id]||{})[sid];
    if(v==='A'&&S.zabs)return 0;
    return typeof v==='number'?v/e.m*20:null;
  }
  var k=mat.coef||1;
  var rows=c.students.map(function(s){
    var iv=I.map(function(e){return nn(e,s.id)}).filter(function(x){return x!==null});
    var mi=iv.length?iv.reduce(function(a,b){return a+b},0)/iv.length:null;
    var d=Dv.map(function(e){return nn(e,s.id)});
    var parts=[mi].concat(d).filter(function(x){return x!==null});
    var ms=parts.length?parts.reduce(function(a,b){return a+b},0)/parts.length:null;
    return {id:s.id,n:s.name,mi:mi,d:d,m:ms,mc:ms===null?null:ms*k};
  });
  var sc=rows.filter(function(r){return r.m!==null}).map(function(r){return r.m}).sort(function(a,b){return b-a});
  rows.forEach(function(r){r.r=r.m===null?null:sc.indexOf(r.m)+1});
  return {ev:ev,I:I,D:Dv,k:k,rows:rows,sc:sc,mat:mat};
}

function impT(id,text){
  var e=S.eva.find(function(x){return x.id===id}),c=gcl();
  if(!e||!c)return;
  var m=S.notes[id]=S.notes[id]||{},ok=0,bad=[],idx=0;
  text.split(/\r?\n/).forEach(function(l){
    var cells=l.split(/\t|;/).map(function(x){return x.trim()}).filter(Boolean);
    if(!cells.length)return;
    if(cells.length===1){
      var sp=cells[0].split(/\s+/);
      cells=[sp.slice(0,-1).join(' '),sp[sp.length-1]];
    }
    var raw=cells[cells.length-1].replace(',','.'),A=/^a(bs)?$/i.test(raw);
    if(!A&&!/^\d+(\.\d+)?$/.test(raw))return;
    var nm=cells.slice(0,-1).join(' '),tk=nt(nm),s=null;
    if(tk.length){
      var b=0;
      c.students.forEach(function(x){
        var st=nt(x.name),h=st.filter(function(k){return tk.indexOf(k)>-1}).length;
        if(st.length&&h===st.length&&h>b){b=h;s=x}
      });
    }else s=c.students[idx];
    idx++;
    if(!s){bad.push(nm||('ligne '+idx));return}
    var nv=A?'A':Math.min(e.m,Math.max(0,parseFloat(raw)));
    if(m[s.id]!==nv)logAdd('i',e,s.id,m[s.id],nv);
    m[s.id]=nv;ok++;
  });
  cur.im=ok+' importée(s)'+(bad.length?' · non reconnu : '+bad.slice(0,8).join(', '):'')+'.';
  save();render();
}

/* ===== Espace d'établissement partagé ===== */
var SQL_SCH="-- EducAct : espace d'\u00e9tablissement partag\u00e9\n-- \u00c0 coller dans Supabase > SQL Editor, apr\u00e8s le script de synchronisation personnelle.\n\ncreate table if not exists public.educact_school (\n  id uuid primary key default gen_random_uuid(),\n  name text not null check (char_length(name) between 2 and 120),\n  code text not null unique,\n  owner uuid not null references auth.users(id) on delete cascade,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.educact_member (\n  school_id uuid not null references public.educact_school(id) on delete cascade,\n  user_id uuid not null references auth.users(id) on delete cascade,\n  display text not null check (char_length(display) between 1 and 80),\n  role text not null default 'ens' check (role in ('ens','pp','sg','cen','dir')),\n  classes text[] not null default '{}',\n  joined_at timestamptz not null default now(),\n  primary key (school_id, user_id)\n);\nalter table public.educact_member add column if not exists classes text[] not null default '{}';\n\n-- Une ligne par enseignant ET par classe : permet de limiter la lecture classe par classe\ncreate table if not exists public.educact_rec (\n  school_id uuid not null references public.educact_school(id) on delete cascade,\n  user_id uuid not null references auth.users(id) on delete cascade,\n  class_key text not null default '',\n  data jsonb not null check (pg_column_size(data) < 3000000),\n  updated_at timestamptz not null default now(),\n  primary key (school_id, user_id, class_key)\n);\n-- Migration d'une ancienne installation (une ligne par enseignant)\nalter table public.educact_rec add column if not exists class_key text not null default '';\nalter table public.educact_rec drop constraint if exists educact_rec_pkey;\nalter table public.educact_rec add primary key (school_id, user_id, class_key);\n\n-- Fonctions d'appui (security definer pour \u00e9viter les boucles de politiques)\ncreate or replace function public.educact_is_member(sid uuid)\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.educact_member where school_id = sid and user_id = auth.uid())\n$$;\n\ncreate or replace function public.educact_can_read_all(sid uuid)\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.educact_member\n                 where school_id = sid and user_id = auth.uid() and role in ('sg','cen','dir'))\n$$;\n\n-- Le professeur principal lit les r\u00e9sultats des classes qui lui sont attribu\u00e9es\ncreate or replace function public.educact_pp_reads(sid uuid, ckey text)\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.educact_member\n                 where school_id = sid and user_id = auth.uid() and role = 'pp' and ckey = any(classes))\n$$;\n\ncreate or replace function public.educact_is_dir(sid uuid)\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.educact_member where school_id = sid and user_id = auth.uid() and role = 'dir')\n$$;\n\nalter table public.educact_school enable row level security;\nalter table public.educact_member enable row level security;\nalter table public.educact_rec enable row level security;\n\ndrop policy if exists educact_school_select on public.educact_school;\ncreate policy educact_school_select on public.educact_school\n  for select to authenticated using (public.educact_is_member(id));\n\ndrop policy if exists educact_member_select on public.educact_member;\ncreate policy educact_member_select on public.educact_member\n  for select to authenticated using (public.educact_is_member(school_id));\ndrop policy if exists educact_member_leave on public.educact_member;\ncreate policy educact_member_leave on public.educact_member\n  for delete to authenticated using (user_id = auth.uid());\n\n-- Un enseignant ne lit que ses propres r\u00e9sultats ; le professeur principal lit ceux de ses classes ;\n-- le surveillant g\u00e9n\u00e9ral, le censeur et le chef lisent ceux de tous.\ndrop policy if exists educact_rec_select on public.educact_rec;\ncreate policy educact_rec_select on public.educact_rec\n  for select to authenticated\n  using (user_id = auth.uid() or public.educact_can_read_all(school_id) or public.educact_pp_reads(school_id, class_key));\ndrop policy if exists educact_rec_insert on public.educact_rec;\ncreate policy educact_rec_insert on public.educact_rec\n  for insert to authenticated\n  with check (user_id = auth.uid() and public.educact_is_member(school_id));\ndrop policy if exists educact_rec_update on public.educact_rec;\ncreate policy educact_rec_update on public.educact_rec\n  for update to authenticated\n  using (user_id = auth.uid())\n  with check (user_id = auth.uid() and public.educact_is_member(school_id));\ndrop policy if exists educact_rec_delete on public.educact_rec;\ncreate policy educact_rec_delete on public.educact_rec\n  for delete to authenticated using (user_id = auth.uid());\n\n-- Cr\u00e9er un \u00e9tablissement : le cr\u00e9ateur devient chef d'\u00e9tablissement\ncreate or replace function public.educact_create_school(p_name text, p_display text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare v_id uuid; v_code text;\nbegin\n  if auth.uid() is null then raise exception 'auth'; end if;\n  loop\n    v_code := upper(substr(replace(gen_random_uuid()::text, '-', ''), 1, 8));\n    exit when not exists (select 1 from public.educact_school where code = v_code);\n  end loop;\n  insert into public.educact_school(name, code, owner)\n    values (left(trim(p_name), 120), v_code, auth.uid()) returning id into v_id;\n  insert into public.educact_member(school_id, user_id, display, role)\n    values (v_id, auth.uid(), left(trim(p_display), 80), 'dir');\n  return json_build_object('id', v_id, 'name', left(trim(p_name), 120), 'code', v_code, 'role', 'dir');\nend $$;\n\n-- Rejoindre avec le code : toujours comme enseignant ; le chef d'\u00e9tablissement attribue les autres r\u00f4les\ncreate or replace function public.educact_join_school(p_code text, p_display text)\nreturns json language plpgsql security definer set search_path = public as $$\ndeclare s public.educact_school; r text;\nbegin\n  if auth.uid() is null then raise exception 'auth'; end if;\n  select * into s from public.educact_school where code = upper(trim(p_code));\n  if not found then raise exception 'code'; end if;\n  insert into public.educact_member(school_id, user_id, display)\n    values (s.id, auth.uid(), left(trim(p_display), 80))\n    on conflict (school_id, user_id) do update set display = excluded.display;\n  select role into r from public.educact_member where school_id = s.id and user_id = auth.uid();\n  return json_build_object('id', s.id, 'name', s.name, 'code', s.code, 'role', r);\nend $$;\n\n-- Attribuer un r\u00f4le (tout chef d'\u00e9tablissement ; le cr\u00e9ateur reste prot\u00e9g\u00e9)\ncreate or replace function public.educact_set_role(p_school uuid, p_user uuid, p_role text)\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if not public.educact_is_dir(p_school) then raise exception 'forbidden'; end if;\n  if p_role not in ('ens','pp','sg','cen','dir') then raise exception 'role'; end if;\n  if exists (select 1 from public.educact_school where id = p_school and owner = p_user) and p_role <> 'dir' then\n    raise exception 'owner';\n  end if;\n  update public.educact_member set role = p_role, classes = case when p_role = 'pp' then classes else '{}' end\n    where school_id = p_school and user_id = p_user;\nend $$;\n\n-- Attribuer les classes d'un professeur principal (cl\u00e9s de classe, ex. '6ea')\ncreate or replace function public.educact_set_classes(p_school uuid, p_user uuid, p_classes text[])\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if not public.educact_is_dir(p_school) then raise exception 'forbidden'; end if;\n  update public.educact_member set classes = coalesce(p_classes, '{}')\n    where school_id = p_school and user_id = p_user and role = 'pp';\nend $$;\n\n-- Retirer un membre (tout chef ; jamais le cr\u00e9ateur ni soi-m\u00eame)\ncreate or replace function public.educact_remove_member(p_school uuid, p_user uuid)\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if not public.educact_is_dir(p_school) then raise exception 'forbidden'; end if;\n  if p_user = auth.uid() or exists (select 1 from public.educact_school where id = p_school and owner = p_user) then\n    raise exception 'owner';\n  end if;\n  delete from public.educact_rec where school_id = p_school and user_id = p_user;\n  delete from public.educact_member where school_id = p_school and user_id = p_user;\nend $$;\n\n-- Changer le code d'invitation (s'il a fuit\u00e9)\ncreate or replace function public.educact_new_code(p_school uuid)\nreturns text language plpgsql security definer set search_path = public as $$\ndeclare v_code text;\nbegin\n  if not public.educact_is_dir(p_school) then raise exception 'forbidden'; end if;\n  loop\n    v_code := upper(substr(replace(gen_random_uuid()::text, '-', ''), 1, 8));\n    exit when not exists (select 1 from public.educact_school where code = v_code);\n  end loop;\n  update public.educact_school set code = v_code where id = p_school;\n  return v_code;\nend $$;\n\nrevoke all on function public.educact_create_school(text, text) from public, anon;\nrevoke all on function public.educact_join_school(text, text) from public, anon;\nrevoke all on function public.educact_set_role(uuid, uuid, text) from public, anon;\nrevoke all on function public.educact_set_classes(uuid, uuid, text[]) from public, anon;\nrevoke all on function public.educact_remove_member(uuid, uuid) from public, anon;\nrevoke all on function public.educact_new_code(uuid) from public, anon;\ngrant execute on function public.educact_create_school(text, text) to authenticated;\ngrant execute on function public.educact_join_school(text, text) to authenticated;\ngrant execute on function public.educact_set_role(uuid, uuid, text) to authenticated;\ngrant execute on function public.educact_set_classes(uuid, uuid, text[]) to authenticated;\ngrant execute on function public.educact_remove_member(uuid, uuid) to authenticated;\ngrant execute on function public.educact_new_code(uuid) to authenticated;\n";
var SCH_C=null,_sq=0;
function schCache(){if(SCH_C===null){try{SCH_C=JSON.parse(localStorage.getItem('surv_schc')||'[]')}catch(e){SCH_C=[]}if(!Array.isArray(SCH_C))SCH_C=[]}return SCH_C}
function schSetCache(a){SCH_C=a;try{localStorage.setItem('surv_schc',JSON.stringify(a))}catch(e){}}
function schOk(){return !!(S.sch&&S.sch.id&&sess()&&sbCfg().url)}
function schH(){return tok().then(function(t){return sbH(sbCfg(),t)})}
function schErr(e){
  var m=String(e&&e.message||e||'');
  if(m==='code')return 'Code inconnu.';
  if(m==='forbidden')return 'Réservé au chef d’établissement.';
  if(m==='owner')return 'Action impossible sur le créateur de l’établissement.';
  if(m==='auth')return 'Connecte-toi d’abord.';
  return 'Échec. Vérifie la connexion et que le script SQL de l’établissement a été exécuté.';
}
function schRpc(fn,args){
  var c=sbCfg();
  return schH().then(function(H){
    return fetch(c.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(args)}).then(function(r){
      return r.text().then(function(t){var j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw ((j&&j.message)||'rest');return j});
    });
  });
}
function schQ(){if(!S.sch||!S.sch.id)return;clearTimeout(_sq);_sq=setTimeout(function(){schPublish().catch(function(){})},8000)}
function schPublish(){
  if(!schOk()||!navigator.onLine)return Promise.resolve();
  var c=sbCfg(),s=sess(),rec=myRec(),sid=S.sch.id,now=new Date().toISOString(),seen={};
  var G={};
  rec.cls.forEach(function(cl){var q=ck(cl.n);if(!q)return;(G[q]=G[q]||[]).push(cl)});
  var rows=Object.keys(G).map(function(q){var o=Object.assign({},rec);o.cls=G[q];o.lg=(rec.lg||[]).filter(function(e){return ck(e.cn)===q});return{school_id:sid,user_id:s.uid,class_key:q,data:o,updated_at:now}});
  return schH().then(function(H){
    var H2=Object.assign({},H,{'Prefer':'resolution=merge-duplicates,return=minimal'});
    var up=rows.length?fetch(c.url+'/rest/v1/educact_rec?on_conflict=school_id,user_id,class_key',{method:'POST',headers:H2,body:JSON.stringify(rows)}):Promise.resolve({ok:true});
    return up.then(function(r){
      if(!r.ok)throw 'rest';
      var keep=rows.length?'&class_key=not.in.'+encodeURIComponent('('+rows.map(function(x){return '"'+x.class_key+'"'}).join(',')+')'):'';
      return fetch(c.url+'/rest/v1/educact_rec?school_id=eq.'+encodeURIComponent(sid)+'&user_id=eq.'+encodeURIComponent(s.uid)+keep,{method:'DELETE',headers:H});
    }).then(function(r){if(!r.ok)throw 'rest';cur.sp=Date.now()});
  });
}
function schPull(){
  if(!schOk()||!navigator.onLine)return Promise.resolve();
  var c=sbCfg(),s=sess(),sid=encodeURIComponent(S.sch.id);
  return schH().then(function(H){
    return Promise.all([
      fetch(c.url+'/rest/v1/educact_rec?select=user_id,class_key,data,updated_at&school_id=eq.'+sid,{headers:H}),
      fetch(c.url+'/rest/v1/educact_member?select=user_id,display,role,classes&school_id=eq.'+sid,{headers:H}),
      fetch(c.url+'/rest/v1/educact_school?select=name,code&id=eq.'+sid,{headers:H}),
      fetch(c.url+'/rest/v1/educact_audit?select=user_id,class_key,entry,at&school_id=eq.'+sid+'&order=at.desc&limit=60',{headers:H}).catch(function(){return {ok:false}})
    ]).then(function(r){if(!r[0].ok||!r[1].ok)throw 'rest';return Promise.all([r[0].json(),r[1].json(),r[2].ok?r[2].json():[],r[3]&&r[3].ok?r[3].json():[]])});
  }).then(function(x){
    var recs=x[0],mem=x[1],sc=x[2][0],by={},ups={},scl={};cur.sau=x[3]||[];
    recs.forEach(function(r){
      var d=r.data;
      if(!(d&&d.edu===1&&Array.isArray(d.cls)&&d.t))return;
      if(!ups[r.user_id]||r.updated_at>ups[r.user_id])ups[r.user_id]=r.updated_at;
      d.cls.forEach(function(cl){scl[r.class_key]=cl.n});
      if(r.user_id===s.uid)return;
      var g=by[r.user_id];
      if(!g)g=by[r.user_id]=Object.assign({},d,{cls:[],srv:r.updated_at,uid:r.user_id});
      g.cls=g.cls.concat(d.cls);
      if(r.updated_at>g.srv)g.srv=r.updated_at;
    });
    schSetCache(Object.keys(by).map(function(k){return by[k]}));
    cur.sm=mem;cur.su=ups;cur.scl=scl;cur.spl=Date.now();
    if(sc){if(sc.code)S.sch.code=sc.code;if(sc.name)S.sch.name=sc.name}
    var me=mem.filter(function(m){return m.user_id===s.uid})[0];
    if(me){
      if(me.role!==role()&&RL[me.role])setRole(me.role);
      S.sch.role=me.role;S.sch.cls=me.classes||[];cur.sx=false;
    }else cur.sx=true;
  });
}
var _ss=0;
function schSync(){
  if(!schOk()||_ss)return Promise.resolve();
  _ss=1;
  return schPublish().catch(function(){}).then(schPull).then(function(){cur.sme=''}).catch(function(e){cur.sme=schErr(e)}).then(function(){_ss=0;if(cur.tab==='et')render()});
}
function schCreate(){
  var n=($('#scn')||{}).value||'',d=($('#scd')||{}).value||'';n=n.trim();d=d.trim();
  if(n.length<2||!d){cur.sme='Indique le nom de l’établissement et ton nom.';return render()}
  schRpc('educact_create_school',{p_name:n,p_display:d}).then(function(j){
    S.me=d;S.sch={id:j.id,name:j.name,code:j.code,role:'dir'};save();cur.sme='';setRole('dir');return schSync();
  }).catch(function(e){cur.sme=schErr(e);render()});
}
function schJoin(){
  var c=(($('#scc')||{}).value||'').trim(),d=(($('#scd')||{}).value||'').trim();
  if(!c||!d){cur.sme='Indique le code et ton nom.';return render()}
  schRpc('educact_join_school',{p_code:c,p_display:d}).then(function(j){
    S.me=d;S.sch={id:j.id,name:j.name,code:j.code,role:j.role};save();cur.sme='';if(RL[j.role])setRole(j.role);return schSync();
  }).catch(function(e){cur.sme=schErr(e);render()});
}
function schLeave(){
  if(!S.sch)return;
  if(!confirm('Quitter l’établissement ? Tes résultats publiés seront retirés du serveur ; tes données restent sur ton téléphone.'))return;
  var c=sbCfg(),s=sess(),sid=encodeURIComponent(S.sch.id),u=encodeURIComponent(s.uid);
  schH().then(function(H){
    return fetch(c.url+'/rest/v1/educact_rec?school_id=eq.'+sid+'&user_id=eq.'+u,{method:'DELETE',headers:H}).then(function(){
      return fetch(c.url+'/rest/v1/educact_member?school_id=eq.'+sid+'&user_id=eq.'+u,{method:'DELETE',headers:H});
    });
  }).then(function(){S.sch=null;schSetCache([]);cur.sm=null;save();render()}).catch(function(e){cur.sme=schErr(e);render()});
}
function schRole(uid,r){
  schRpc('educact_set_role',{p_school:S.sch.id,p_user:uid,p_role:r}).then(function(){return schPull()}).then(function(){render()}).catch(function(e){cur.sme=schErr(e);render()});
}
function schKick(uid){
  if(!confirm('Retirer ce membre et ses résultats ?'))return;
  schRpc('educact_remove_member',{p_school:S.sch.id,p_user:uid}).then(function(){return schPull()}).then(function(){render()}).catch(function(e){cur.sme=schErr(e);render()});
}
function schSaveCls(uid){
  var box=document.getElementById('cl_'+uid),ks=[];
  if(!box)return;
  Array.prototype.forEach.call(box.querySelectorAll('input[type=checkbox]:checked'),function(i){ks.push(i.dataset.k)});
  schRpc('educact_set_classes',{p_school:S.sch.id,p_user:uid,p_classes:ks}).then(function(){toast('Classes enregistrées.');return schPull()}).then(function(){render()}).catch(function(e){cur.sme=schErr(e);render()});
}
function schNewCode(){
  if(!confirm('Générer un nouveau code ? L’ancien ne fonctionnera plus pour de nouvelles adhésions. Les membres actuels ne sont pas affectés.'))return;
  schRpc('educact_new_code',{p_school:S.sch.id}).then(function(c){S.sch.code=c;save();render();toast('Nouveau code créé.')}).catch(function(e){cur.sme=schErr(e);render()});
}
function schCopyCode(){var t=document.createElement('textarea');t.value=S.sch.code;document.body.appendChild(t);t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();toast(ok?'Code copié.':'Code : '+S.sch.code)}
function schShareCode(){

function copySchSql(){var m=$('#scm');try{var t=document.createElement('textarea');t.value=SQL_SCH;document.body.appendChild(t);t.select();var ok=document.execCommand('copy');t.remove();m.textContent=ok?'Copié.':'Sélectionne le texte et copie-le.'}catch(e){m.textContent='Sélectionne le texte et copie-le.'}}
function schCard(){

  }

      +'<label>Mon nom (tel qu’il apparaîtra)</label><input id="scd" value="'+esc(S.me||'')+'" placeholder="Ex. M. Julien">'
      +'<b style="display:block;margin-top:12px">Rejoindre avec un code</b><input id="scc" placeholder="Code reçu du chef d’établissement" autocapitalize="characters">'

  }else{

    h+='<div class="st"><div class="nm"><b>'+esc(S.sch.name)+'</b><small>Mon rôle : '+esc((RL[S.sch.role]||{}).n||S.sch.role)+(cur.sp?' · résultats envoyés '+dt(cur.sp):'')+'</small></div></div>';
    if(cur.sx)h+='<div class="alarm" style="margin:8px 0">Tu n’es plus membre de cet établissement. Quitte-le puis rejoins-le avec le code.</div>';
    if(isDir)h+='<div class="mu" style="margin-top:6px">Code à donner aux enseignants :</div><div style="font-size:22px;font-weight:800;letter-spacing:3px;margin:4px 0">'+esc(S.sch.code)+'</div>'
      +'<div class="row"><button class="ghost" onclick="schCopyCode()">Copier</button><button class="ghost" onclick="schShareCode()">WhatsApp</button><button class="ghost" onclick="schNewCode()">Nouveau code</button></div>';
    var seeAll=['sg','cen','dir'].indexOf(S.sch.role)>-1,scl=cur.scl||{};
    if(mem.length){
      h+='<b style="display:block;margin-top:12px">Équipe ('+mem.length+')</b>'+mem.map(function(m){
        var pub=ups[m.user_id],self=me&&m.user_id===me.uid,mng=isDir&&!self;

function etDups(o){
  var ks=Object.keys(o.st),out=[],nd=S.noDup||{};
  function cnt(k){return o.subs.filter(function(b){return b.st.some(function(x){return etKey(o,x)===k})}).length}
  for(var i=0;i<ks.length;i++)for(var j=i+1;j<ks.length;j++){
    var a=ks[i],b=ks[j];
    if(nd[a+'|'+b]||nd[b+'|'+a])continue;
    if(a.charAt(0)==='#'&&b.charAt(0)==='#')continue;
    var na=sk(o.st[a].n),nb=sk(o.st[b].n),ta=na.split(' '),tb=nb.split(' '),sm=ta.length<=tb.length?ta:tb,lg=ta.length<=tb.length?tb:ta;
    var sub=sm.length>=2&&sm.every(function(t){return lg.indexOf(t)>-1});
    var near=Math.min(na.length,nb.length)>=7&&lev(na,nb)<=2;
    if(sub||near){var ca=cnt(a),cb=cnt(b);out.push(ca>=cb?{a:a,b:b}:{a:b,b:a})}
  }
  return out;
}

function yrNext(a){var m=String(a||'').match(/(\d{4})\D+(\d{4})/);return m?(+m[2])+'-'+((+m[2])+1):''}
function yrPromo(n){
  n=String(n||'');
  var m=n.match(/^\s*([3-6])\s*(?:(?:ème|eme|ième|ieme|è|e)(?![a-zà-ÿ]))?(.*)$/i),f=function(x,r){r=r||'';return x+(r&&!/^\s/.test(r)?' ':'')+r};
  if(m){var k=+m[1];return k>3?f((k-1)+'ème',m[2]):''}
  m=n.match(/^\s*(?:2nde|2de|seconde)(?![a-zà-ÿ])(.*)$/i);if(m)return f('1ère',m[1]);
  m=n.match(/^\s*(?:1ère|1ere|première|premiere)(?![a-zà-ÿ])(.*)$/i);if(m)return f('Tle',m[1]);
  return '';
}

function yrBuild(S0,o){
  var N=JSON.parse(JSON.stringify(S0)),map={},src={};
  N.classes=[];N.mats={};
  S0.classes.forEach(function(c){
    var tn=String((o.to||{})[c.id]||'').trim();
    c.students.forEach(function(st){
      var d=(o.dec||{})[st.id],name=d==='P'?tn:d==='R'?c.name:'';
      if(!name)return;
      var k=name.toLowerCase(),t=map[k];
      if(!t){t=map[k]={id:uid(),name:name,students:[]};if(c.t)t.t=1;N.classes.push(t);src[k]=S0.mats&&S0.mats[c.id]||[]}
      else if(c.t)t.t=1;
      if(t.students.some(function(x){return x.id===st.id}))return;
      var z={id:st.id,name:st.name};
      ['mt','tel','sx'].forEach(function(f){if(st[f])z[f]=st[f]});
      z.rd=d==='R'?'Oui':'Non';
      t.students.push(z);
    });
  });
  N.classes.sort(function(a,b){return a.name.localeCompare(b.name,'fr',{numeric:true})});
  N.classes.forEach(function(c){
    c.students.sort(function(a,b){return a.name.localeCompare(b.name,'fr')});
    var m=src[c.name.toLowerCase()]||[];
    N.mats[c.id]=m.map(function(x){return{id:uid(),n:x.n,coef:x.coef}});
  });
  N.att={};N.inc=[];N.sanc=[];N.eva=[];N.notes={};N.apr={};N.alias={};N.noDup={};N.etab={};N.log=[];N.pp='';
  N.annee=o.annee;N.t0=Date.now();N.bk=0;
  return N;
}

var GT=[

function rest(){

var ITER=150000,ITER_OLD=50000;
function pHash(p,salt,it){
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder)){
    var q=salt+':'+p,h=5381;
    for(var i=0;i<q.length;i++)h=((h<<5)+h+q.charCodeAt(i))|0;
    return Promise.resolve('d'+h);
  }
  var enc=new TextEncoder(),key=enc.encode(p);
  return crypto.subtle.importKey('raw',key,{name:'PBKDF2'},false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:it||ITER_OLD,hash:'SHA-256'},k,256)})
    .then(function(bits){return Array.prototype.map.call(new Uint8Array(bits),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
}
function pcfg(){try{return JSON.parse(localStorage.getItem(PK)||'null')}catch(e){return null}}
function pinSet(){
  var c=pcfg(),a=$('#p1').value,b=$('#p2').value,m=$('#pm');
  if(!/^\d{4,6}$/.test(a)){m.textContent='4 à 6 chiffres.';return}
  if(a!==b){m.textContent='Les deux diffèrent.';return}
  function go(){
    var q=(function(){try{var u=new Uint8Array(16);crypto.getRandomValues(u);return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}catch(e){return Math.random().toString(36).slice(2)}})();
    pHash(a,q,ITER).then(function(h){
      localStorage.setItem(PK,JSON.stringify({s:q,h:h,n:a.length,it:ITER}));
      m.textContent='PIN enregistré.';
    });
  }
  if(c)pinCheck($('#p0').value).then(function(ok){ok?go():m.textContent='Actuel incorrect.'});
  else go();
}
function pinOff(){
